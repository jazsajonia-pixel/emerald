name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Flutter stable toolchain. Update deliberately, not implicitly.
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "17"

jobs:
  check-and-build:
    name: Format, analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Prepare optional release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EMERALD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/emerald-release.jks"
            echo "EMERALD_KEYSTORE_PATH=$RUNNER_TEMP/emerald-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore provided via secrets."
          else
            echo "No release keystore secret: the APK will be signed with the runner's debug key."
          fi

      - name: Build release APK
        env:
          EMERALD_KEYSTORE_PASSWORD: ${{ secrets.EMERALD_KEYSTORE_PASSWORD }}
          EMERALD_KEY_ALIAS: ${{ secrets.EMERALD_KEY_ALIAS }}
          EMERALD_KEY_PASSWORD: ${{ secrets.EMERALD_KEY_PASSWORD }}
        # Run number as versionCode so newer CI builds can upgrade older ones
        # (when signed with the same key).
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Report signing status
        run: |
          rm -f "$RUNNER_TEMP/emerald-release.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'certificate DN' || true)
          echo "APK signer: $SIGNER"
          {
            echo "### APK signing"
            if echo "$SIGNER" | grep -q 'CN=Android Debug'; then
              echo "Signed with this runner's **debug key** (not a stable release key). Installing a newer build over an older one fails; uninstall first. See docs/RELEASE.md."
            else
              echo "Signed with the configured release key: \`$SIGNER\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK checksum
        run: |
          ls -l build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: emerald-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Emulator smoke test (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test --reporter expanded
